<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<title>教师端 · 放学状态</title>
<link rel="stylesheet" href="/teacher.css">
</head>
<body>

<div class="login-wrap" id="login">
  <form class="login-card" id="login-form">
    <h1>放学状态 · 教师端</h1>
    <p class="sub">输入口令后即可管理各班放学状态</p>
    <input id="pass" class="input" type="password" inputmode="numeric"
           autocomplete="current-password" placeholder="口令" required>
    <button class="btn primary block" type="submit">进入</button>
    <p class="err" id="login-err"></p>
    <a class="link" href="/">← 返回大屏</a>
  </form>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="bar-title">教师控制台</div>
    <div class="bar-actions">
      <button class="btn ghost sm" id="btn-qr">二维码</button>
      <button class="btn ghost sm" id="btn-settings">设置</button>
      <button class="btn ghost sm" id="btn-logout">退出</button>
    </div>
  </header>

  <div class="summary-bar">
    <span id="sum">已放学 0 / 0</span>
    <span class="hint">点班级方块切换 已放学 / 未放学</span>
  </div>

  <main class="grades" id="grades"></main>
</div>

<!-- 二维码 -->
<div class="sheet" id="qr-sheet" hidden>
  <div class="sheet-box">
    <h2>扫码看大屏</h2>
    <p class="sub">用另一台设备（大屏电脑、家长手机）打开下面这个地址</p>
    <img id="qr-img" class="qr" alt="大屏二维码">
    <div class="url" id="qr-url"></div>
    <div class="row">
      <button class="btn primary grow" id="qr-copy">复制链接</button>
      <button class="btn ghost grow" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="settings-sheet" hidden>
  <div class="sheet-box wide">
    <div class="sheet-head">
      <h2>设置</h2>
      <button class="x" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<script src="/teacher.js"></script>
</body>
</html>
